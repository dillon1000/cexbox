name: Build Xbox package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Find the Windows SDK
        shell: pwsh
        run: |
          $uap = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Platforms\UAP"
          $names = @()
          if (Test-Path $uap) { $names = @(Get-ChildItem $uap | Select-Object -ExpandProperty Name | Sort-Object { [version]$_ } -Descending) }
          $ver = if ($names.Count -gt 0) { [string]$names[0] } else { "10.0.26100.0" }
          Write-Host "Using SDK $ver (found: $($names -join ', '))"
          "SDKVER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the native loader
        shell: pwsh
        run: |
          cmake -S native -B native/build -A x64 "-DCMAKE_SYSTEM_NAME=WindowsStore" "-DCMAKE_SYSTEM_VERSION=10.0"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build native/build --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item native/build/Release/xbloader.dll app/

      - name: List the loader's imports
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          & $dumpbin.FullName /imports app/xbloader.dll | Tee-Object loader-imports.txt

      - name: Make placeholder logos
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force app/Assets | Out-Null
          $sizes = @{ "Square150x150Logo" = @(150,150); "Square44x44Logo" = @(44,44); "Wide310x150Logo" = @(310,150); "StoreLogo" = @(50,50); "SplashScreen" = @(620,300) }
          foreach ($name in $sizes.Keys) {
            $w = $sizes[$name][0]; $h = $sizes[$name][1]
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode = 'AntiAlias'
            $g.Clear([System.Drawing.Color]::FromArgb(31, 42, 36))
            $size = [Math]::Max(8, [Math]::Min($w, $h) * 0.45)
            $font = New-Object System.Drawing.Font "Consolas", $size, ([System.Drawing.FontStyle]::Bold), ([System.Drawing.GraphicsUnit]::Pixel)
            $fmt = New-Object System.Drawing.StringFormat
            $fmt.Alignment = 'Center'; $fmt.LineAlignment = 'Center'
            $brush = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(92, 201, 138))
            $g.DrawString(">_", $font, $brush, (New-Object System.Drawing.RectangleF 0, 0, $w, $h), $fmt)
            $bmp.Save("app/Assets/$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }

      - name: Create a test signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Cexbox" -KeyUsage DigitalSignature -FriendlyName "Cexbox test" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "cexbox" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\test.pfx" -Password $pw | Out-Null

      - name: Restore packages
        run: msbuild app/Cexbox.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /p:TargetPlatformVersion=$env:SDKVER

      - name: Build the app package
        run: >
          msbuild app/Cexbox.csproj
          /p:Configuration=Release
          /p:Platform=x64
          /p:TargetPlatformVersion=$env:SDKVER
          /p:AppxBundle=Never
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile="$env:RUNNER_TEMP\test.pfx"
          /p:PackageCertificatePassword=cexbox
          /p:AppxPackageDir="$env:GITHUB_WORKSPACE\out\"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: cexbox-package
          retention-days: 14
          path: |
            out/**
            loader-imports.txt
